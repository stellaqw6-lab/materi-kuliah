<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rak Kuliah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2733;--muted:#5d6b7a;--paper:#eef1f4;--card:#fbfcfd;--line:#d3dae1;--c:#2d5be3;
--sans:"Bricolage Grotesque",system-ui,sans-serif;--serif:"Literata",Georgia,serif}
@media(prefers-color-scheme:dark){:root{--ink:#e6ebf0;--muted:#98a5b3;--paper:#161d25;--card:#1e2731;--line:#33404d}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--serif);min-height:100vh}
h1,h2,h3,button,input,select,textarea,label,summary{font-family:var(--sans)}
button{cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.brand{font:700 1.25rem var(--sans);letter-spacing:-.01em}
.btn{border:1px solid var(--ink);background:transparent;padding:8px 14px;border-radius:6px;font-size:.9rem;font-weight:500}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.danger{border-color:#b3372f;color:#b3372f}
.layout{display:grid;grid-template-columns:240px 1fr;max-width:1000px;margin:0 auto;padding:20px}
.tabs{display:flex;flex-direction:column;gap:6px;padding-right:20px}
.tab{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:var(--card);padding:10px 12px;border-radius:0 8px 8px 0;border-left:10px solid var(--c);font-weight:500;font-size:.95rem;box-shadow:inset 0 0 0 1px var(--line)}
.tab small{display:block;color:var(--muted);font-weight:400}
.tab[aria-selected=true]{background:var(--ink);color:var(--paper);box-shadow:none;margin-right:-20px;padding-right:32px}
.tab[aria-selected=true] small{color:inherit;opacity:.7}
.add-course{margin-top:8px;border:1px dashed var(--muted);background:none;padding:10px;border-radius:8px;color:var(--muted);font-size:.9rem}
.head{border-bottom:3px solid var(--c);padding-bottom:12px;margin-bottom:16px}
.head h1{margin:0;font-size:1.9rem;line-height:1.15;letter-spacing:-.02em}
.head p{margin:4px 0 10px;color:var(--muted);font:.9rem var(--sans)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:280px}
.bar i{display:block;height:100%;background:var(--c)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tools input{flex:1;min-width:150px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:.95rem}
textarea{min-height:140px;font-family:var(--serif);resize:vertical}
h2.wk{font-size:.95rem;margin:22px 0 6px;color:var(--muted);font-weight:700}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:0 8px 8px 0;margin-bottom:2px;font-weight:500;font-family:var(--sans)}
.item .t{flex:1}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted);white-space:nowrap}
.note{margin:-2px 0 8px 16px;padding:0 12px;color:var(--muted);font-size:.9rem;max-width:68ch}
.acts{display:flex;gap:8px;margin:-2px 0 10px 12px}
.empty{color:var(--muted);padding:32px 0}
.panel{max-width:560px;margin:60px auto;padding:0 20px}
.panel h1{font-size:1.8rem;letter-spacing:-.02em}
.panel code,.panel pre{background:var(--card);border:1px solid var(--line);padding:2px 6px;border-radius:4px;font-size:.85rem}
.panel pre{padding:12px;overflow-x:auto}
dialog{border:1px solid var(--ink);border-radius:10px;padding:20px;width:min(480px,92vw);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px}
dialog label{display:block;font-size:.85rem;font-weight:500;margin:10px 0 3px}
.row{display:flex;gap:10px}.row>*{flex:1}
.sw{display:flex;gap:8px;margin-top:4px}
.sw input{position:absolute;opacity:0;width:0}
.sw span{display:block;width:30px;height:30px;border-radius:50%;background:var(--x);cursor:pointer}
.sw input:checked+span{outline:3px solid var(--ink);outline-offset:2px}
.sw input:focus-visible+span{outline:3px solid var(--ink)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
[hidden]{display:none!important}
@media(max-width:700px){
.layout{grid-template-columns:1fr;padding:14px}
.tabs{flex-direction:row;overflow-x:auto;padding:0 0 12px;gap:6px}
.tab{flex:none;border-left:0;border-top:8px solid var(--c);border-radius:0 0 8px 8px}
.tab[aria-selected=true]{margin-right:0;padding-right:12px}
.add-course{flex:none;margin:0}
}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>

<header class="top">
  <span class="brand">Rak Kuliah</span>
  <button class="btn" id="authBtn" hidden>Keluar dari mode admin</button>
</header>

<!-- Belum diisi config -->
<section class="panel" id="setup" hidden>
  <h1>Isi konfigurasi Firebase dulu</h1>
  <p>Buka file ini di editor, cari bagian <code>firebaseConfig</code> di dalam &lt;script&gt;, lalu tempel konfigurasi dari Firebase Console (Project settings &rarr; Your apps &rarr; Web app).</p>
</section>

<main class="layout" id="app">
  <nav class="tabs" id="tabs" aria-label="Mata kuliah"></nav>
  <section id="main"></section>
</main>

<dialog id="adminDlg">
  <form id="adminForm">
    <h3>Masuk pengelola</h3>
    <label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="username" required>
    <label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password" required>
    <p id="aErr" style="color:#b3372f;font:.85rem var(--sans);margin:8px 0 0"></p>
    <div class="foot"><button type="button" class="btn" data-close>Batal</button><button class="btn solid">Masuk</button></div>
  </form>
</dialog>

<dialog id="courseDlg">
  <form id="courseForm">
    <h3>Tambah mata kuliah</h3>
    <label for="cName">Nama matkul</label><input id="cName" required maxlength="60">
    <label for="cCode">Kode atau dosen (opsional)</label><input id="cCode" maxlength="60">
    <label>Warna rak</label><div class="sw" id="cColors"></div>
    <div class="foot"><button type="button" class="btn" data-close>Batal</button><button class="btn solid">Simpan matkul</button></div>
  </form>
</dialog>

<dialog id="matDlg">
  <form id="matForm">
    <h3 id="mTitleH">Tambah materi</h3>
    <label for="mTitle">Judul</label><input id="mTitle" required maxlength="120">
    <div class="row">
      <div><label for="mWeek">Pertemuan ke-</label><input id="mWeek" type="number" min="1" max="30"></div>
      <div><label for="mType">Jenis</label>
        <select id="mType"><option>Slide</option><option>Dokumen</option><option>Rekaman</option><option>Gambar</option><option>Tugas</option></select></div>
    </div>
    <label for="mFile">File (PDF, gambar, dokumen, dll)</label>
    <input id="mFile" type="file">
    <p id="mCur" style="font:.8rem var(--sans);color:var(--muted);margin:4px 0 0"></p>
    <div id="mProgWrap" class="bar" style="margin-top:8px;max-width:none" hidden><i id="mProgBar" style="width:0"></i></div>
    <p id="mProgTxt" style="font:.8rem var(--sans);color:var(--muted);margin:4px 0 0"></p>
    <label for="mBody">Catatan tambahan (opsional)</label><textarea id="mBody" style="min-height:70px"></textarea>
    <p id="mErr" style="color:#b3372f;font:.85rem var(--sans);margin:8px 0 0"></p>
    <div class="foot"><button type="button" class="btn" id="mCancel" data-close>Batal</button><button class="btn solid" id="mSubmit">Simpan materi</button></div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, set, update, remove, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getStorage, ref as sref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ====== ISI DI SINI dengan config dari Firebase Console ====== */
const firebaseConfig = {
  apiKey: "AIzaSyDQVL2rC30PPjs_Bmk48vQhnVj00tkxwj0",
  authDomain: "store-minzy.firebaseapp.com",
  databaseURL: "https://store-minzy-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "store-minzy",
  storageBucket: "store-minzy.firebasestorage.app",
  appId: "1:746471870516:web:a937e409565d90424b3a61"
};
/* ============================================================= */

const $ = id => document.getElementById(id);
const COLORS = ["#2d5be3","#1f8a7d","#b8891a","#8a3f72","#4f7d2f","#c2456b"];
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => n.append(k));
  return n;
};

if (!firebaseConfig.databaseURL) { $("setup").hidden = false; $("app").hidden = true; throw new Error("Firebase config kosong"); }

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);
let auth = null;
try { auth = getAuth(app); } catch {}

let loaded = false, admin = false, courses = [], mats = [], current = null, search = "", editId = null, loadErr = "";

// ---------- Data (dibaca publik) ----------
const toList = snap => Object.entries(snap.val() || {}).map(([id, d]) => ({ id, ...d }));
const fail = e => { loadErr = "Data belum bisa dimuat (" + (e.code || e.message) + "). Cek Rules Realtime Database."; render(); };
onValue(ref(db, "courses"), snap => {
  courses = toList(snap).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (!courses.find(c => c.id === current)) current = courses[0]?.id || null;
  loaded = true; loadErr = ""; render();
}, fail);
onValue(ref(db, "materials"), snap => { mats = toList(snap); render(); }, fail);

// ---------- Akses pengelola (tersembunyi: alamat halaman + #admin) ----------
const checkHash = () => { if (location.hash === "#admin" && !admin) $("adminDlg").showModal(); };
addEventListener("hashchange", checkHash);
if (auth) onAuthStateChanged(auth, u => {
  admin = !!u; $("authBtn").hidden = !u;
  if (u) $("adminDlg").close(); else checkHash();
  render();
}); else checkHash();
$("adminDlg").addEventListener("close", () => {
  $("aPass").value = "";
  if (location.hash === "#admin") history.replaceState(null, "", location.pathname + location.search);
});
$("adminForm").onsubmit = async e => {
  e.preventDefault(); $("aErr").textContent = "";
  if (!auth) { $("aErr").textContent = "apiKey belum diisi di firebaseConfig."; return; }
  try { await signInWithEmailAndPassword(auth, $("aEmail").value.trim(), $("aPass").value); }
  catch { $("aErr").textContent = "Email atau password salah."; }
};
$("authBtn").onclick = () => signOut(auth);

// ---------- Render ----------
function render() {
  const tabs = $("tabs"); tabs.replaceChildren();
  courses.forEach(c => {
    const total = mats.filter(m => m.courseId === c.id).length;
    const b = el("button", { className: "tab", role: "tab" },
      el("span", {}, c.name, el("small", {}, total + " materi")));
    b.style.setProperty("--c", c.color);
    b.setAttribute("aria-selected", c.id === current);
    b.onclick = () => { current = c.id; search = ""; render(); };
    tabs.append(b);
  });
  if (admin) tabs.append(el("button", { className: "add-course", textContent: "+ Tambah matkul", onclick: () => openCourse() }));

  const main = $("main"); main.replaceChildren();
  if (loadErr) main.append(el("div", { className: "empty", role: "alert" }, loadErr));
  const c = courses.find(x => x.id === current);
  if (!c) {
    if (!loaded && !loadErr) main.append(el("div", { className: "empty" }, "Memuat materi…"));
    else if (!loadErr) main.append(el("div", { className: "empty" }, admin ? "Belum ada mata kuliah. Tambahkan matkul pertamamu di samping." : "Belum ada materi yang dipublikasikan."));
    return;
  }
  main.style.setProperty("--c", c.color);
  const list = mats.filter(m => m.courseId === c.id);
  const done = list.filter(m => m.done).length;

  const head = el("div", { className: "head" }, el("h1", {}, c.name),
    el("p", {}, [c.code, admin ? done + " dari " + list.length + " materi sudah dipelajari" : list.length + " materi"].filter(Boolean).join(" — ")));
  if (admin) {
    const bar = el("div", { className: "bar" }, el("i"));
    bar.firstChild.style.width = (list.length ? Math.round(done / list.length * 100) : 0) + "%";
    head.append(bar);
  }
  main.append(head);

  const s = el("input", { type: "search", placeholder: "Cari judul, isi, atau jenis", value: search, ariaLabel: "Cari materi" });
  s.oninput = () => { search = s.value; renderList(); };
  const tools = el("div", { className: "tools" }, s);
  if (admin) tools.append(
    el("button", { className: "btn solid", textContent: "Tambah materi", onclick: () => openMat() }),
    el("button", { className: "btn danger sm", textContent: "Hapus matkul", onclick: () => delCourse(c) }));
  main.append(tools, el("div", { id: "list" }));
  renderList();
}

function renderList() {
  const box = $("list"); if (!box) return;
  box.replaceChildren();
  const q = search.trim().toLowerCase();
  const list = mats.filter(m => m.courseId === current &&
    (!q || [m.title, m.body, m.type].some(t => (t || "").toLowerCase().includes(q))));
  if (!list.length) {
    box.append(el("div", { className: "empty" }, q ? "Tidak ada materi yang cocok dengan \"" + search + "\"." : "Rak ini masih kosong."));
    return;
  }
  const weeks = [...new Set(list.map(m => m.week || 0))].sort((a, b) => (a || 99) - (b || 99));
  weeks.forEach(w => {
    box.append(el("h2", { className: "wk" }, w ? "Pertemuan " + w : "Tanpa pertemuan"));
    list.filter(m => (m.week || 0) === w).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).forEach(m => {
      const row = el("a", {
        className: "item" + (admin && m.done ? " done" : ""),
        href: m.url || "#", target: m.url ? "_blank" : "", rel: "noopener noreferrer"
      });
      if (!m.url) row.onclick = e => e.preventDefault();
      if (admin) {
        const chk = el("input", { type: "checkbox", checked: !!m.done, ariaLabel: "Sudah dipelajari" });
        chk.style.width = "auto";
        chk.onclick = e => { e.stopPropagation(); e.preventDefault(); update(ref(db, "materials/" + m.id), { done: chk.checked }); };
        row.append(chk);
      }
      row.append(el("span", { className: "t" }, m.title), el("span", { className: "tag" }, m.type));
      box.append(row);
      if (m.body) box.append(el("p", { className: "note" }, m.body));
      if (admin) box.append(el("div", { className: "acts" },
        el("button", { className: "btn sm", textContent: "Ubah", onclick: () => openMat(m) }),
        el("button", { className: "btn sm danger", textContent: "Hapus", onclick: () => delMat(m) })));
    });
  });
}

// ---------- Dialog matkul ----------
function openCourse() {
  $("cName").value = ""; $("cCode").value = "";
  const sw = $("cColors"); sw.replaceChildren();
  COLORS.forEach((col, i) => {
    const r = el("input", { type: "radio", name: "col", value: col, checked: i === courses.length % COLORS.length, ariaLabel: "Warna " + (i + 1) });
    const sp = el("span"); sp.style.setProperty("--x", col);
    sw.append(el("label", { style: "margin:0" }, r, sp));
  });
  $("courseDlg").showModal();
}
$("courseForm").onsubmit = async e => {
  e.preventDefault();
  const color = document.querySelector('input[name=col]:checked').value;
  const r = push(ref(db, "courses"));
  await set(r, { name: $("cName").value.trim(), code: $("cCode").value.trim(), color, createdAt: serverTimestamp() });
  current = r.key; $("courseDlg").close();
};

// ---------- Dialog materi ----------
function openMat(m) {
  editId = m?.id || null;
  $("mTitleH").textContent = m ? "Ubah materi" : "Tambah materi";
  $("mTitle").value = m?.title || ""; $("mWeek").value = m?.week || "";
  $("mType").value = m?.type || "Slide"; $("mBody").value = m?.body || "";
  $("mFile").value = ""; $("mErr").textContent = "";
  $("mCur").textContent = m?.fileName ? "File saat ini: " + m.fileName + " (biarkan kosong untuk tetap memakainya)" : "";
  $("mProgWrap").hidden = true; $("mProgBar").style.width = "0"; $("mProgTxt").textContent = "";
  $("matDlg").showModal();
}
const fmtKB = b => (b / 1024).toFixed(0) + " KB";
let curTask = null;
$("mCancel").onclick = () => { if (curTask) curTask.cancel(); };
$("matForm").onsubmit = async e => {
  e.preventDefault();
  const file = $("mFile").files[0];
  if (!file && !editId) { $("mErr").textContent = "Pilih file dulu."; return; }
  const btn = $("mSubmit"); btn.disabled = true;
  $("mErr").textContent = "";
  try {
    const data = { title: $("mTitle").value.trim(), week: parseInt($("mWeek").value) || 0,
      type: $("mType").value, body: $("mBody").value };
    if (file) {
      $("mFile").disabled = true;
      $("mProgWrap").hidden = false;
      btn.textContent = "Mengunggah...";
      const path = "materials/" + (editId || crypto.randomUUID()) + "/" + file.name;
      const fref = sref(storage, path);
      const task = uploadBytesResumable(fref, file);
      curTask = task;
      const t0 = Date.now();
      await new Promise((res, rej) => task.on("state_changed", snap => {
        const pct = Math.round(snap.bytesTransferred / snap.totalBytes * 100);
        $("mProgBar").style.width = pct + "%";
        const secs = (Date.now() - t0) / 1000;
        const kbps = secs > 0 ? (snap.bytesTransferred / 1024 / secs) : 0;
        $("mProgTxt").textContent = pct + "% — " + fmtKB(snap.bytesTransferred) + " / " + fmtKB(snap.totalBytes) + (kbps > 0 ? " (" + kbps.toFixed(0) + " KB/s)" : "");
      }, rej, res));
      curTask = null;
      data.url = await getDownloadURL(fref);
      data.fileName = file.name;
      data.filePath = path;
    }
    if (editId) await update(ref(db, "materials/" + editId), data);
    else await set(push(ref(db, "materials")), { ...data, courseId: current, done: false, createdAt: serverTimestamp() });
    $("matDlg").close();
  } catch (err) {
    curTask = null;
    $("mErr").textContent = err.code === "storage/canceled" ? "Unggahan dibatalkan." : "Gagal mengunggah (" + (err.code || err.message) + ").";
  } finally {
    btn.disabled = false; btn.textContent = "Simpan materi";
    $("mFile").disabled = false; $("mProgWrap").hidden = true;
  }
};

document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

// ---------- Hapus ----------
async function delMat(m) {
  if (!confirm("Hapus materi \"" + m.title + "\"?")) return;
  if (m.filePath) try { await deleteObject(sref(storage, m.filePath)); } catch {}
  await remove(ref(db, "materials/" + m.id));
}
async function delCourse(c) {
  const own = mats.filter(m => m.courseId === c.id);
  if (!confirm("Hapus matkul \"" + c.name + "\" beserta " + own.length + " materinya? Ini tidak bisa dibatalkan.")) return;
  for (const m of own) if (m.filePath) try { await deleteObject(sref(storage, m.filePath)); } catch {}
  const gone = { ["courses/" + c.id]: null };
  own.forEach(m => { gone["materials/" + m.id] = null; });
  await update(ref(db), gone);
}
</script>
</body>
</html>
